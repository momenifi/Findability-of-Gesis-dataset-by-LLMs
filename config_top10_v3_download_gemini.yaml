temperature: 0
top_p: 1
input_path: "top 10/requested_10_datasets_full_metadata.csv"
input_format: csv
qrels_input_path: all_research_data_full_metadata.csv
qrels_input_format: csv
output_dir: output/top10_visibility/v3_download_prompt/gemini
output_dir_by_variant:
  V3_TITLE_ONLY: output/top10_visibility/v3_download_prompt/gemini/v3_title_only
source_row_limit: 10
sample_per_variant: 0
random_seed: 42
time_format: decade
query_variants:
  - V3_TITLE_ONLY
title_query_template: "Where can you download the dataset titled {title}? Please give the direct link and which database the link belongs to."
modes:
  - WEB_SEARCH
